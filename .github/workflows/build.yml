name: Build Independent AppImage
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfuse2 libgtk-3-dev libnotify-dev \
          libsdl2-dev libwebkit2gtk-4.0-dev libxtst-dev patchelf

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          # Grab pre-built wxPython and install ffsubsync + Nuitka
          pip install -U Gooey nuitka zstandard ffsubsync \
          -f https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04

      - name: Compile AppImage
        run: |
          python -m nuitka --standalone --onefile \
          --enable-plugin=tk-inter \
          --include-package=ffsubsync \
          --include-package=wx \
          --include-package=gooey \
          --linux-icon=utilities-terminal \
          --output-filename=ffsubsync-gui.AppImage \
          --include-data-files=/usr/bin/ffmpeg=usr/bin/ffmpeg \
          --include-data-files=/usr/bin/ffprobe=usr/bin/ffprobe \
          gui.py

      - name: Upload Finished AppImage
        uses: actions/upload-artifact@v4
        with:
          name: FFsubsync-Executable
          path: ffsubsync-gui.AppImage
